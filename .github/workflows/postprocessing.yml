name: Postprocessing checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -r requirements.txt
      - run: python -m compileall -q coupled
      - run: python -m unittest discover -s tests -v
      - run: bash -n cluster/method_check.slurm
      - run: bash -n cluster/mesh_probe.slurm
      - run: bash -n cluster/fixed_mesh_check.slurm
      - run: bash -n cluster/nosarev_axes.slurm
      - run: bash -n cluster/nos6_held.slurm && bash -n cluster/nos6_wall.slurm && bash -n cluster/postprocess.slurm && bash -n cluster/permeability_models.slurm && bash -n cluster/momentum_balance.slurm
      - run: bash -n cluster/fixed_shape_study.slurm
      - run: bash -n cluster/submit_fixed_shape_study.sh
      - run: bash -n cluster/collect_fixed_shape_study.slurm
      - run: python -m py_compile cluster/extend_fixed_shape_study.py
      - run: bash -n cluster/extend_fixed_shape_study.slurm && bash -n cluster/submit_extend_fixed_shape_study.sh
